// TASKBAR WINDOW SYSTEM
///////////////////////////////////////////////////////////////

const taskbar = document.getElementById("taskbar");

function minimizeToTaskbar(id, label) {

  const win = document.getElementById(id);
  if (!win) return;

  win.style.display = "none";

  const btn = document.createElement("button");
  btn.innerText = label;
  btn.id = "task_" + id;

  btn.onclick = () => restoreWindow(id);

  taskbar.appendChild(btn);
}

function restoreWindow(id) {

  const win = document.getElementById(id);
  if (!win) return;

  win.style.display = "block";

  const btn = document.getElementById("task_" + id);
  if (btn) btn.remove();
}

function openMedia(index) {

  currentIndex = index;

  const lightbox = document.getElementById("lightbox");

  lightbox.style.display = "flex";

/* =========================
   ⌨️ KEYBOARD CONTROLS
========================= */

document.addEventListener("keydown", (e) => {
  const lightbox = document.getElementById("lightbox");

  if (lightbox.style.display !== "flex") return;

  if (e.key === "ArrowRight") {
    showMedia(currentIndex + 1);
  }

  if (e.key === "ArrowLeft") {
    showMedia(currentIndex - 1);
  }

  if (e.key === "Escape") {
    lightbox.style.display = "none";
    document.getElementById("lightboxContent").innerHTML = "";
  }
});

========================= */

  .then(res => res.json())
  .then(data => {
    galleryData = data;
    buildGallery();
  })
  .catch(err => {
    console.error("Gallery failed to load:", err);
  });

function buildGallery() {
  galleryGrid.innerHTML = "";

  galleryData.forEach((item, index) => {

    const wrapper = document.createElement("div");
    wrapper.className = "gallery-item";

    if (item.type === "image") {
      const img = document.createElement("img");
      img.src = item.src;
      img.onclick = () => openMedia(index);
      wrapper.appendChild(img);
    }

    if (item.type === "video") {
      const vid = document.createElement("video");
      vid.src = item.src;
      vid.muted = true;
      vid.onclick = () => openMedia(index);
      wrapper.appendChild(vid);
    }

    galleryGrid.appendChild(wrapper);
  });
}

<div id="space-cursor">
  <div class="planet"></div>

<script>
const cursor = document.getElementById("space-cursor");

let mouseX = 0;
let mouseY = 0;

let currentX = 0;
let currentY = 0;

document.addEventListener("mousemove", (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;

  spawnStar(mouseX, mouseY);
  spawnStar(mouseX, mouseY);
  spawnStar(mouseX, mouseY);
  spawnStar(mouseX, mouseY);
});

function animate() {
  currentX += (mouseX - currentX) * 0.2;
  currentY += (mouseY - currentY) * 0.2;

  cursor.style.transform =
    `translate(${currentX}px, ${currentY}px) translate(-50%, -50%)`;

  requestAnimationFrame(animate);
}
animate();

/* STAR TRAIL (separate from cursor — IMPORTANT) */
function spawnStar(x, y) {
  const star = document.createElement("div");
  star.className = "cursor-star";

  const size = Math.random() * 3 + 1.5;

  star.style.width = size + "px";
  star.style.height = size + "px";

  star.style.left = x + (Math.random() - 0.5) * 10 + "px";
  star.style.top = y + (Math.random() - 0.5) * 10 + "px";

  document.body.appendChild(star);

  setTimeout(() => star.remove(), 900);
}


/* =========================================================
   MUSIC PLAYER SYSTEM
========================================================= */

const player = document.getElementById("player");
const trackDisplay = document.getElementById("trackDisplay");
const musicStatus = document.getElementById("musicStatus");

let songs = [];
let queue = [];
let started = false;
let playlistReady = false;

fetch("mymusic.json")
  .then(res => res.json())
  .then(data => {

    songs = data;

    buildQueue();

    playlistReady = true;

    musicStatus.innerText =
      `Playlist (${songs.length} songs) 🎧`;
  })
  .catch(err => {

    console.error(err);

    musicStatus.innerText =
      "Playlist failed to load";
  });

function shuffle(arr) {

  const copy = [...arr];

  for (let i = copy.length - 1; i > 0; i--) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [copy[i], copy[j]] =
      [copy[j], copy[i]];
  }

  return copy;
}

function buildQueue() {
  queue = shuffle(songs);
}

function playNextTrack() {

  if (!playlistReady) return;

  if (!started) {

    buildQueue();

    started = true;
  }

  if (queue.length === 0) {
    buildQueue();
  }

  const next = queue.shift();

  if (!next) return;

  player.src = next.file;

  player.load();

  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }

  player.play()
    .then(() => {

      trackDisplay.innerText =
        "Now Playing: " + next.name;

      musicStatus.innerText =
        "Listening to " + next.name;
    })
    .catch(() => {

      musicStatus.innerText =
        "Press play again";
    });
}

function togglePlay(btn) {

  flash(btn);

  if (!audioUnlocked) {

    audioCtx.resume();

    audioUnlocked = true;
  }

  if (!player.src) {

    playNextTrack();

    return;
  }

  if (player.paused) {
    player.play();
  } else {
    player.pause();
  }
}

function nextSong(btn) {

  flash(btn);

  randomizeTheme();

  playNextTrack();
}

player.addEventListener(
  "ended",
  playNextTrack
);

/* =========================
   SEEK BAR
========================= */

const seekBar =
  document.getElementById("seekBar");

const currentTimeEl =
  document.getElementById("currentTime");

const durationEl =
  document.getElementById("duration");

player.addEventListener(
  "loadedmetadata",
  () => {

    seekBar.max =
      Math.floor(player.duration);

    durationEl.textContent =
      formatTime(player.duration);
  }
);

player.addEventListener(
  "timeupdate",
  () => {

    seekBar.value =
      Math.floor(player.currentTime);

    currentTimeEl.textContent =
      formatTime(player.currentTime);
  }
);

seekBar.addEventListener(
  "input",
  () => {

    player.currentTime =
      seekBar.value;
  }
);

function formatTime(sec) {

  const m =
    Math.floor(sec / 60);

  const s =
    Math.floor(sec % 60)
      .toString()
      .padStart(2, "0");

  return `${m}:${s}`;
}

/* =========================
   VISUALIZER
========================= */

const canvas =
  document.getElementById("visualizer");

const ctx =
  canvas.getContext("2d");

canvas.width = 320;
canvas.height = 140;

const audioCtx =
  new (window.AudioContext ||
    window.webkitAudioContext)();

let audioUnlocked = false;

const analyser =
  audioCtx.createAnalyser();

analyser.fftSize = 256;

const source =
  audioCtx.createMediaElementSource(player);

source.connect(analyser);

analyser.connect(audioCtx.destination);

const dataArray =
  new Uint8Array(
    analyser.frequencyBinCount
  );

const smoothData =
  new Array(128).fill(0);

let time = 0;
let hue = 0;

function draw() {

  requestAnimationFrame(draw);

  analyser.getByteFrequencyData(
    dataArray
  );

  ctx.fillStyle =
    "rgba(0,0,0,0.12)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  time += 0.01;
  hue += 0.4;

  ctx.beginPath();

  ctx.moveTo(
    0,
    canvas.height / 2
  );

  for (
    let x = 0;
    x <= canvas.width;
    x += 2
  ) {

    let i =
      Math.floor(
        (x / canvas.width) *
        dataArray.length
      );

    let value =
      dataArray[i] / 255;

    smoothData[i] =
      smoothData[i] * 0.75 +
      value * 0.25;

    let bass =
      smoothData[i];

    let wave =
      Math.sin(
        x * 0.012 + time
      ) * 18 +

      Math.sin(
        x * 0.006 +
        time * 1.2
      ) * 12 +

      bass * 45;

    let ripple =
      Math.sin(
        x * 0.08 +
        time * 3
      ) * 3;

    let y =
      canvas.height / 2 +
      wave +
      ripple;

    ctx.lineTo(x, y);
  }

  ctx.lineTo(
    canvas.width,
    canvas.height
  );

  ctx.lineTo(
    0,
    canvas.height
  );

  ctx.closePath();

  let gradient =
    ctx.createLinearGradient(
      0,
      0,
      canvas.width,
      0
    );

  gradient.addColorStop(
    0,
    `hsla(${hue},100%,65%,0.9)`
  );

  gradient.addColorStop(
    0.5,
    `hsla(${hue + 40},100%,60%,0.7)`
  );

  gradient.addColorStop(
    1,
    `hsla(${hue + 80},100%,65%,0.4)`
  );

  ctx.fillStyle =
    gradient;

  ctx.shadowBlur = 15;

  ctx.shadowColor =
    `hsla(${hue},100%,60%,0.6)`;

  ctx.fill();

  ctx.shadowBlur = 0;
}

draw();


</script>
